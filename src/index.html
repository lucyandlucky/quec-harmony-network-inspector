<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'">
  <title>Quec Network Inspector</title>
  <link rel="stylesheet" href="styles.css">
  <script src="curl.js" defer></script>
  <script src="renderer.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><img src="icons/activity.svg" alt=""></div>
        <div class="brand-copy">
          <strong>Quec Network Inspector</strong>
          <span>HarmonyOS</span>
        </div>
      </div>
      <div class="device-tools">
        <div class="device-select-wrap">
          <img src="icons/cable.svg" alt="">
          <select id="device-select" aria-label="设备"><option value="">查找设备中</option></select>
          <img class="select-chevron" src="icons/chevron-down.svg" alt="">
        </div>
        <button id="refresh-devices" class="icon-button" type="button" title="刷新设备" aria-label="刷新设备">
          <img src="icons/refresh-cw.svg" alt="">
        </button>
        <button id="connection-button" class="icon-button" type="button" title="连接设备" aria-label="连接设备">
          <img id="connection-icon" src="icons/play.svg" alt="">
        </button>
        <div id="connection-status" class="connection-status offline"><span class="status-dot"></span><span id="connection-text">未连接</span></div>
      </div>
    </header>

    <div class="workbench">
      <section class="request-pane" aria-label="请求列表">
        <div class="pane-top">
          <div class="pane-heading">
            <h1>请求</h1>
            <span id="request-count" class="count">0</span>
          </div>
          <button id="clear-requests" class="icon-button" type="button" title="清空请求" aria-label="清空请求">
            <img src="icons/trash-2.svg" alt="">
          </button>
        </div>
        <div class="filters">
          <label class="search-box">
            <img src="icons/search.svg" alt="">
            <input id="request-search" type="search" placeholder="搜索 URL" aria-label="搜索请求">
          </label>
          <div class="app-select-wrap">
            <select id="app-filter" aria-label="按包名筛选"><option value="">全部应用</option></select>
            <img src="icons/chevron-down.svg" alt="">
          </div>
        </div>
        <div class="request-columns" aria-hidden="true">
          <span>方法 / 请求</span><span>状态</span><span>耗时</span>
        </div>
        <div id="request-list" class="request-list">
          <div class="list-empty" id="list-empty">
            <img src="icons/activity.svg" alt="">
            <strong>暂无请求</strong>
            <span id="list-empty-detail">等待设备连接</span>
          </div>
        </div>
        <div class="pane-footer"><span id="visible-count">显示 0 条</span><span id="device-footer">未连接设备</span></div>
      </section>

      <main class="detail-pane">
        <div id="detail-empty" class="detail-empty">
          <div class="empty-symbol"><img src="icons/activity.svg" alt=""></div>
          <h2>选择一个请求</h2>
          <p>暂无请求详情</p>
        </div>
        <div id="detail-view" class="detail-view" hidden>
          <header class="detail-header">
            <div class="detail-heading">
              <div class="detail-eyebrow"><span id="detail-package"></span><span id="detail-time"></span></div>
              <div class="detail-title-row"><span id="detail-method" class="method-label"></span><h2 id="detail-path"></h2></div>
              <div id="detail-url" class="detail-url"></div>
            </div>
            <button id="copy-curl" class="command-button" type="button" title="复制 cURL">
              <img src="icons/copy.svg" alt=""><span id="copy-label">复制 cURL</span>
            </button>
          </header>
          <div class="detail-summary">
            <div class="summary-item"><span>状态</span><strong id="detail-status"></strong></div>
            <div class="summary-item"><span>耗时</span><strong id="detail-duration"></strong></div>
            <div class="summary-item"><span>开始时间</span><strong id="detail-start"></strong></div>
          </div>
          <nav class="tabs" aria-label="请求详情">
            <button type="button" class="tab active" data-tab="overview">概览</button>
            <button type="button" class="tab" data-tab="headers">请求头 / 响应头</button>
            <button type="button" class="tab" data-tab="body">Body</button>
            <button type="button" class="tab" data-tab="curl">cURL</button>
          </nav>
          <div id="detail-content" class="detail-content"></div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
